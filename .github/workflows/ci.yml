name: CI Workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Synthetic Flight Generator
        run: |
          python generate_test_video.py --output test_drone.mp4 --duration 2 --num-people 3

      - name: Test Drone Person & Intrusion Detector (Headless)
        run: |
          python detect.py --source test_drone.mp4 --headless --max-frames 10

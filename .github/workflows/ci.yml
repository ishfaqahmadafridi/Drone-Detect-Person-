name: CI Workflow

on:
  push:
    branches: [ main, refactor/*, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  backend-ci:
    name: Backend CI (FastAPI, YOLOv8 & Vision Pipeline)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Verify Python Bytecode Compilation
        run: |
          python -m compileall backend

      - name: Test Synthetic Flight Generator (app.simulator)
        run: |
          cd backend
          python generate_test_video.py --output test_drone.mp4 --duration 2 --num-people 3

      - name: Test Drone Person & Intrusion Pipeline (Headless)
        run: |
          cd backend
          python detect.py --source test_drone.mp4 --headless --max-frames 10

      - name: Verify FastAPI Microservice Endpoints
        run: |
          cd backend
          python -c "from main import app; print('FastAPI microservice loaded successfully:', app.title)"

  frontend-ci:
    name: Frontend CI (Next.js 16, TypeScript & ESLint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript Strict Typecheck
        run: |
          cd frontend
          npx tsc --noEmit

      - name: Run ESLint Quality Check
        run: |
          cd frontend
          npm run lint

      - name: Build Next.js Production Bundle
        run: |
          cd frontend
          npm run build

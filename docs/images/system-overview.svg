<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="670" viewBox="0 0 1200 670" role="img" aria-label="From camera feed to operator decision"><rect width="1200" height="670" rx="24" fill="#081322"/><text x="44" y="58" fill="#38bdf8" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">AERO-GUARD</text><text x="44" y="105" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">From camera feed to operator decision</text><text x="44" y="140" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Architecture overview · Video processing and manual aircraft control use separate paths.</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#38bdf8" stroke-width="1.5"/></marker></defs><rect x="44" y="190" width="310" height="175" rx="16" fill="#111e32" stroke="#293c55"/><rect x="44" y="210" width="4" height="30" rx="2" fill="#38bdf8"/><text x="68" y="230" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">01  Video sources</text><text x="68" y="266" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Ground CCTV and webcams</text><text x="68" y="293" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Aerial video and uploads</text><text x="68" y="320" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Synthetic demonstration feeds</text><rect x="444" y="190" width="310" height="175" rx="16" fill="#111e32" stroke="#293c55"/><rect x="444" y="210" width="4" height="30" rx="2" fill="#38bdf8"/><text x="468" y="230" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">02  Vision backend</text><text x="468" y="266" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Person detection and tracking</text><text x="468" y="293" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Restricted zones and alerts</text><text x="468" y="320" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Optional appearance matching</text><rect x="844" y="190" width="310" height="175" rx="16" fill="#111e32" stroke="#293c55"/><rect x="844" y="210" width="4" height="30" rx="2" fill="#38bdf8"/><text x="868" y="230" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">03  Operator dashboard</text><text x="868" y="266" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Live previews and tracking IDs</text><text x="868" y="293" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Suspect selection and evidence</text><text x="868" y="320" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Camera views and status</text><path d="M365 275 L430 275" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/><path d="M765 275 L830 275" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/><text x="44" y="412" fill="#34d399" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">MANUAL CONTROL PATH</text><rect x="44" y="435" width="310" height="140" rx="16" fill="#111e32" stroke="#293c55"/><rect x="44" y="455" width="4" height="30" rx="2" fill="#34d399"/><text x="68" y="475" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Control panel</text><text x="68" y="511" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Hold movement · take off · land</text><rect x="444" y="435" width="310" height="140" rx="16" fill="#111e32" stroke="#293c55"/><rect x="444" y="455" width="4" height="30" rx="2" fill="#34d399"/><text x="468" y="475" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Control service</text><text x="468" y="511" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Session ownership · input expiry</text><rect x="844" y="435" width="310" height="140" rx="16" fill="#111e32" stroke="#293c55"/><rect x="844" y="455" width="4" height="30" rx="2" fill="#34d399"/><text x="868" y="475" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Simulation / Tello</text><text x="868" y="511" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">SDK commands over UDP / Wi-Fi</text><path d="M365 505 L430 505" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/><path d="M765 505 L830 505" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/><text x="44" y="625" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Conceptual diagram. Real-flight smoothness and measured Tello telemetry remain unverified.</text></svg>
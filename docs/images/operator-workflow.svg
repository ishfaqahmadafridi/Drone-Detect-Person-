<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="A clear workflow for ground and aerial views"><rect width="1200" height="700" rx="24" fill="#081322"/><text x="44" y="58" fill="#38bdf8" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">AERO-GUARD</text><text x="44" y="105" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">A clear workflow for ground and aerial views</text><text x="44" y="140" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400">Operator guide · Begin with a simulated feed or uploaded video before connecting hardware.</text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#38bdf8" stroke-width="1.5"/></marker></defs><text x="44" y="199" fill="#38bdf8" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">01</text><rect x="44" y="215" width="310" height="150" rx="16" fill="#111e32" stroke="#293c55"/><rect x="44" y="235" width="4" height="30" rx="2" fill="#38bdf8"/><text x="68" y="255" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Choose a perspective</text><text x="68" y="291" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Ground CCTV: eye-level footage</text><text x="68" y="318" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Aerial Drone: drone footage</text><text x="444" y="199" fill="#38bdf8" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">02</text><rect x="444" y="215" width="310" height="150" rx="16" fill="#111e32" stroke="#293c55"/><rect x="444" y="235" width="4" height="30" rx="2" fill="#38bdf8"/><text x="468" y="255" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Open a video source</text><text x="468" y="291" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Select a camera or upload a clip</text><text x="468" y="318" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Use simulation to explore the UI</text><text x="844" y="199" fill="#38bdf8" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">03</text><rect x="844" y="215" width="310" height="150" rx="16" fill="#111e32" stroke="#293c55"/><rect x="844" y="235" width="4" height="30" rx="2" fill="#38bdf8"/><text x="868" y="255" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Review detections</text><text x="868" y="291" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Inspect boxes and tracking IDs</text><text x="868" y="318" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Review zones, alerts, and evidence</text><path d="M365 290 L430 290" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/><path d="M765 290 L830 290" fill="none" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)"/><rect x="44" y="420" width="535" height="165" rx="16" fill="#111e32" stroke="#293c55"/><rect x="44" y="440" width="4" height="30" rx="2" fill="#a78bfa"/><text x="68" y="460" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Ground: select a suspect</text><text x="68" y="496" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Freeze the detected frame and choose tracked people.</text><text x="68" y="523" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Capture portraits for optional cross-camera ReID.</text><rect x="619" y="420" width="535" height="165" rx="16" fill="#111e32" stroke="#293c55"/><rect x="619" y="440" width="4" height="30" rx="2" fill="#34d399"/><text x="643" y="460" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700">Aerial: use manual controls</text><text x="643" y="496" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Connect the separate Tello control panel.</text><text x="643" y="523" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">Take off, hold a direction, release, hover, and land.</text><text x="44" y="635" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400">ReID needs its own model setup. Manual control does not automatically enable video or following.</text></svg>